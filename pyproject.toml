[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipf-binary-eliminant"
version = "0.1.0"
description = "Exact determinantal eliminants for limits of iterative proportional fitting with a binary variable"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Shankar Sivarajan", email = "sivarajn@umich.edu" },
]
dependencies = [
  "numpy>=1.24",
  "python-flint>=0.6",
]

[tool.setuptools.packages.find]
include = ["ipf_binary_eliminant*"]
